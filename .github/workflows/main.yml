# Generates the contribution-snake SVGs used in README.md and publishes them
# to the `snk_svg` branch:
#   https://raw.githubusercontent.com/wwmogu/wwmogu/snk_svg/github-contribution-grid-snake.svg
#   https://raw.githubusercontent.com/wwmogu/wwmogu/snk_svg/github-contribution-grid-snake-dark.svg
name: generate animation

on:
  # once a day (00:00 UTC ≈ 10:30 Adelaide, daylight time)
  schedule:
    - cron: "0 0 * * *"

  # run manually from the Actions tab
  workflow_dispatch:

  # run when the profile repo's default branch changes
  push:
    branches:
      - main

# needed to push the generated SVGs to the snk_svg branch
permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # svg-only variant: same output as Platane/snk@v3, but faster (no Docker image)
      - name: Generate snake from contribution grid
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            snk_dist/github-contribution-grid-snake.svg
            snk_dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Push SVGs to the snk_svg branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: snk_svg
          build_dir: snk_dist
          commit_message: "chore: update contribution snake"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
